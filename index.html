<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>讃岐うどん 店舗検索</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-soft: #ccfbf1;
      --border: #e5e7eb;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #f0fdfa 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(15, 118, 110, 0.08);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.5vw, 2.2rem);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 220px auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: .92rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
    }

    button:hover { opacity: .9; }
    button:active { transform: translateY(1px); }

    .result-meta {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .95rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .shop-name {
      margin: 0;
      font-size: 1.05rem;
    }

    .tag {
      font-size: .76rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .rating {
      color: var(--accent);
      font-weight: 700;
      font-size: .92rem;
    }

    .info {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.5;
    }

    .no-result {
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>讃岐うどん 店舗検索</h1>
      <p>
        エリアやキーワードで、香川の人気うどん店を探せます。<br>
        「朝うどん」「セルフ」「釜玉」などの言葉でも検索可能です。
      </p>
    </section>

    <section class="search-panel">
      <div class="grid">
        <div>
          <label for="keyword">キーワード</label>
          <input id="keyword" type="text" placeholder="店名・特徴・メニューで検索" />
        </div>
        <div>
          <label for="area">エリア</label>
          <select id="area">
            <option value="all">すべて</option>
          </select>
        </div>
        <div>
          <button id="searchBtn" type="button">検索する</button>
        </div>
      </div>
    </section>

    <p class="result-meta" id="resultMeta"></p>
    <section class="cards" id="cards"></section>
  </main>

  <script>
    const shops = [
      {
        name: "山越うどん",
        area: "綾川町",
        rating: 4.6,
        specialty: "釜玉発祥の人気店",
        address: "香川県綾歌郡綾川町羽床上602-2",
        open: "9:00〜13:30",
        note: "朝から行列。釜玉とちくわ天が定番。"
      },
      {
        name: "がもううどん",
        area: "坂出市",
        rating: 4.5,
        specialty: "セルフ・コシ強め",
        address: "香川県坂出市加茂町420-1",
        open: "8:30〜13:30",
        note: "シンプルなかけ出汁が絶品。"
      },
      {
        name: "手打十段 うどんバカ一代",
        area: "高松市",
        rating: 4.4,
        specialty: "釜バターうどん",
        address: "香川県高松市多賀町1-6-7",
        open: "6:00〜18:00",
        note: "朝うどんの定番スポット。"
      },
      {
        name: "日の出製麺所",
        area: "坂出市",
        rating: 4.5,
        specialty: "昼1時間だけ営業",
        address: "香川県坂出市富士見町1-8-5",
        open: "11:30〜12:30",
        note: "時間限定で食べられる名店。"
      },
      {
        name: "池上製麺所",
        area: "高松市",
        rating: 4.2,
        specialty: "もちっとした麺",
        address: "香川県高松市香川町川東下899-1",
        open: "10:30〜14:00",
        note: "るみばあちゃんで有名。"
      },
      {
        name: "長田 in 香の香",
        area: "善通寺市",
        rating: 4.4,
        specialty: "釜あげうどん",
        address: "香川県善通寺市金蔵寺町1180",
        open: "9:00〜15:00",
        note: "徳利のつけ出汁で食べるスタイル。"
      },
      {
        name: "谷川米穀店",
        area: "まんのう町",
        rating: 4.7,
        specialty: "しょうゆうどん",
        address: "香川県仲多度郡まんのう町川東1490",
        open: "11:00〜13:00",
        note: "青唐辛子と酢で味変する通好み。"
      },
      {
        name: "おか泉",
        area: "宇多津町",
        rating: 4.3,
        specialty: "ひや天おろし",
        address: "香川県綾歌郡宇多津町浜八番丁129-10",
        open: "11:00〜20:00",
        note: "観光客にも人気の上品な一杯。"
      }
    ];

    const areaSelect = document.getElementById("area");
    const keywordInput = document.getElementById("keyword");
    const cards = document.getElementById("cards");
    const resultMeta = document.getElementById("resultMeta");
    const searchBtn = document.getElementById("searchBtn");

    const allAreas = [...new Set(shops.map((shop) => shop.area))].sort((a, b) => a.localeCompare(b, "ja"));
    allAreas.forEach((area) => {
      const option = document.createElement("option");
      option.value = area;
      option.textContent = area;
      areaSelect.appendChild(option);
    });

    function render(list) {
      resultMeta.textContent = `${list.length}件の店舗が見つかりました`;

      if (!list.length) {
        cards.innerHTML = "<div class='no-result'>条件に一致する店舗が見つかりませんでした。別のキーワードをお試しください。</div>";
        return;
      }

      cards.innerHTML = list.map((shop) => `
        <article class="card">
          <div class="title-row">
            <h2 class="shop-name">${shop.name}</h2>
            <span class="tag">${shop.area}</span>
          </div>
          <div class="rating">★ ${shop.rating.toFixed(1)}</div>
          <p class="info"><strong>特徴:</strong> ${shop.specialty}</p>
          <p class="info"><strong>住所:</strong> ${shop.address}</p>
          <p class="info"><strong>営業時間:</strong> ${shop.open}</p>
          <p class="info">${shop.note}</p>
        </article>
      `).join("");
    }

    function search() {
      const keyword = keywordInput.value.trim().toLowerCase();
      const area = areaSelect.value;

      const filtered = shops.filter((shop) => {
        const inArea = area === "all" || shop.area === area;
        const combinedText = `${shop.name} ${shop.specialty} ${shop.note}`.toLowerCase();
        const keywordMatch = !keyword || combinedText.includes(keyword);
        return inArea && keywordMatch;
      });

      render(filtered);
    }

    searchBtn.addEventListener("click", search);
    keywordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") search();
    });

    render(shops);
  </script>
</body>
</html>
